services:
  db:
    container_name: postgres_wine_cellar
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=wine_cellar
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Azerty,123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  wine-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_shop_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/wine_cellar
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Azerty,123

    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data:
